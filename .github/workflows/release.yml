name: Release

# v1.2.3 gibi bir etiket gonderilince macOS ve Windows surumleri derlenir ve
# GitHub Releases'a yuklenir. Indirme sitesi /releases/latest/download/...
# adreslerini kullandigi icin site ayrica guncellenmez.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.0.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Konsey $TAG" --generate-notes

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.email "ci@konsey.local" && git config --global user.name "Konsey CI"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/Konsey-*.dmg release/Konsey-*.zip release/Konsey-*-setup.exe)
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
