name: Release

# v1.2.3 gibi bir etiket gonderilince macOS ve Windows surumleri derlenir ve
# GitHub Releases'a yuklenir. Indirme sitesi /releases/latest/download/...
# adreslerini kullandigi icin site ayrica guncellenmez.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.0.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Konsey $TAG" --generate-notes --notes "Downloads: macOS (Apple Silicon / Intel) and Windows below. [Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)"

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # Iki Mac mimarisi ayri islerde: ayni makinede art arda DMG olusturmak
          # GitHub'in Mac makinelerinde ara sira "hdiutil detach" hatasi veriyor.
          - os: macos-latest
            args: --mac --arm64
          - os: macos-latest
            args: --mac --x64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.email "ci@konsey.local" && git config --global user.name "Konsey CI"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package
        if: ${{ !(matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '') }}
        shell: bash
        run: |
          # Gecici disk goruntusu hatalarina karsi bir kez daha denenir.
          npx electron-builder ${{ matrix.args }} --publish never || { sleep 20; npx electron-builder ${{ matrix.args }} --publish never; }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Windows kod imzalama: depo ayarlarina WIN_CSC_LINK (base64 .pfx) ve
          # WIN_CSC_KEY_PASSWORD gizli degerleri eklenince kurulum ve uygulama
          # imzali derlenir; Akilli Uygulama Denetimi imzasiz programlari engeller.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # ------------------------------------------------------------------
      # Windows imzalama (SignPath Foundation). Depo degiskeni
      # SIGNPATH_ORGANIZATION_ID ve gizli SIGNPATH_API_TOKEN tanimlaninca calisir:
      # once uygulama imzalanir, sonra imzali uygulamadan kurulum uretilip o da
      # imzalanir. Ayrintilar: docs/signing.md
      - name: Package app (unsigned, for signing)
        if: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: npx electron-builder --win --x64 --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload unsigned app
        id: unsigned-app
        if: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: konsey-app-unsigned
          path: release/win-unpacked
      - name: Sign app
        if: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: konsey
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app
      - name: Build installer from signed app
        if: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: bash
        run: |
          rm -rf release/win-unpacked && cp -R signed-app release/win-unpacked
          npx electron-builder --win nsis --x64 --prepackaged release/win-unpacked --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload unsigned installer
        id: unsigned-installer
        if: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: konsey-installer-unsigned
          path: release/Konsey-windows-x64-setup.exe
      - name: Sign installer
        if: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: konsey
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
      - name: Use signed installer
        if: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: bash
        run: cp signed-installer/Konsey-windows-x64-setup.exe release/Konsey-windows-x64-setup.exe

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/Konsey-*.dmg release/Konsey-*.zip release/Konsey-*-setup.exe)
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
