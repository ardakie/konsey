name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.email "ci@konsey.local" && git config --global user.name "Konsey CI"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Paketlenmis uygulama gercekten aciliyor mu: pencere yuklenir, ajan kesfi calisir, uygulama kapanir.
      - name: Package (unpacked)
        run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d release/mac*/Konsey.app | head -1)
          "$APP/Contents/MacOS/Konsey" --smoke-test
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release\win-unpacked\Konsey.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
